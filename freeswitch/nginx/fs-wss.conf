# Agent WebRTC signalling, terminated on 443.
#
# Agents sit behind corporate and home firewalls where 443 is the only port
# that reliably passes, so mod_verto binds to localhost and this proxies to
# it. Certificate expiry here takes EVERY agent offline at once with no
# warning -- see README, "The failure that will actually happen".

server {
    listen 443 ssl http2;
    server_name __FS_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__FS_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FS_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /verto {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # A registered agent sits idle between calls for a whole shift. The
        # default 60s read timeout would tear that socket down mid-shift and
        # the console would look randomly disconnected.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location / { return 404; }
}
