<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The dialer admin has moved</title>
<noscript><meta http-equiv="refresh" content="3;url=https://admin.proptechnologyai.com/"></noscript>
<style>
  :root{--bg:#0B0E14;--card:#141824;--border:#232838;--text:#E7EAF3;
         --text-2:#A8B0C4;--text-dim:#6F7891;--gold:#D4B06A}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;
        justify-content:center;padding:24px;background:var(--bg);
        color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,
        'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .card{max-width:520px;width:100%;padding:30px 28px;border:1px solid var(--border);
         border-radius:14px;background:var(--card);text-align:center}
  h1{margin:0 0 10px;font-size:1.05rem}
  p{margin:0 0 18px;font-size:.9rem;color:var(--text-2)}
  a.btn{display:inline-block;padding:10px 20px;border-radius:9px;
         background:var(--gold);color:#10131A;font-weight:600;
         text-decoration:none;font-size:.9rem}
  a.btn:hover{filter:brightness(1.08)}
  .host{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
  .note{margin:16px 0 0;font-size:.8rem;color:var(--text-dim)}
</style>
</head>
<body>
  <div class="card">
    <h1>The dialer admin has moved</h1>
    <p>
      It is now at <span class="host">admin.proptechnologyai.com</span>. You will be asked to sign
      in once there -- a different address means a separate session, which is
      the point of the move.
    </p>
    <a class="btn" href="https://admin.proptechnologyai.com/">Open the dialer admin</a>
    <p class="note">Update your bookmark; this page will not stay here forever.</p>
  </div>
<script>
// Carry the query and hash across, so a deep link survives the move.
var dest = "https://admin.proptechnologyai.com/" + location.search + location.hash;
document.querySelector('a.btn').href = dest;
setTimeout(function(){ location.replace(dest); }, 1200);
</script>
</body>
</html>
